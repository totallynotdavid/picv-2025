name: Security

on:
    push:
        branches: ["master"]
    pull_request:
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

concurrency:
    group: security-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    UV_VERSION: "0.11.27"

permissions: {}

jobs:
    codeql:
        name: CodeQL
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: ["python"]
        steps:
            - uses: actions/checkout@v7

            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended,security-and-quality

            - uses: github/codeql-action/analyze@v4
              with:
                  category: "/language:${{ matrix.language }}"

    audit:
        name: Dependency audit (runtime)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3 # 8.3.2
              with:
                  version: ${{ env.UV_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - run: uv audit --locked --preview-features audit-command --no-dev --no-group build

    audit-toolchain:
        name: Dependency audit (toolchain, advisory)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3 # 8.3.2
              with:
                  version: ${{ env.UV_VERSION }}
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - run: uv audit --locked --preview-features audit-command
              continue-on-error: true

    gitleaks:
        name: Gitleaks (secrets)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
