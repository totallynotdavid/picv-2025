[project]
name = "tsdhn-api"
version = "0.0.1"
description = "TSDHN FastAPI service and Procrastinate worker"
requires-python = ">=3.14"
readme = "readme.md"
license = { text = "MIT" }
authors = [
    { name = "David Duran", email = "dadch1404@gmail.com" },
]
dependencies = [
    "tsdhn",
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "anyio==4.14.1",
    "psycopg[binary,pool]>=3.3.4",
    "minio>=7.2.20",
    "procrastinate>=3.9.0",
]

[project.scripts]
tsdhn-api = "api.main:start_app"
tsdhn-worker = "api.worker:main"
tsdhn-compute-migrate = "api.migrate:main"
tsdhn-procrastinate-migrate = "api.queue_migrate:main"
tsdhn-web-grants = "api.web_grants:main"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = ""
